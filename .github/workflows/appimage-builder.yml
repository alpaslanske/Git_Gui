name: AppImage Otomatik Paketleme

on:
  push:
    tags:
      - 'v*' # Triggers only on version tags like v1.3.6

# Grants write privileges to create releases and upload binary files
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository files
    - name: Kodları Çek
      uses: actions/checkout@v4

    # 2. Download the AppImage packaging tool
    - name: AppImage Hazırla
      run: |
        wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    # 3. Build the AppImage using the same script available to developers
    - name: AppImage Derle
      run: |
        APPIMAGETOOL=./appimagetool-x86_64.AppImage ./build.sh

    # 4. Upload the release asset
    - name: GitHub Release Olarak Yayınla
      uses: softprops/action-gh-release@v2
      with:
        files: Git_Gui_Portable-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
